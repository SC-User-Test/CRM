# Kubernetes deployment configuration for AWS EKS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compcrm-app
  labels:
    app: compcrm-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compcrm-app
  template:
    metadata:
      labels:
        app: compcrm-app
    spec:
      containers:
      - name: compcrm-app
        image: compcrm-app:latest
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: compcrm-secrets
              key: database-url
        - name: DATABASE_USERNAME
          valueFrom:
            secretKeyRef:
              name: compcrm-secrets
              key: database-username
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: compcrm-secrets
              key: database-password
        - name: DDL_AUTO
          value: "validate"
        - name: CLOUDWATCH_METRICS_ENABLED
          value: "true"
        - name: CLOUDWATCH_NAMESPACE
          value: "CompCRMApp"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: compcrm-service
spec:
  selector:
    app: compcrm-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
---
apiVersion: v1
kind: Secret
metadata:
  name: compcrm-secrets
type: Opaque
stringData:
  database-url: "jdbc:mysql://your-rds-endpoint:3306/crm?useSSL=true&requireSSL=true"
  database-username: "your-db-username"
  database-password: "your-db-password"