apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crm-storage-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc  # Change based on cloud provider
  resources:
    requests:
      storage: 10Gi
---
# AWS EFS StorageClass Example
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-xxxxxxxxx  # Replace with your EFS ID
  directoryPerms: "700"
  gidRangeStart: "1000"
  gidRangeEnd: "2000"
  basePath: "/crm-storage"
---
