apiVersion: v1
kind: Secret
metadata:
  name: crm-secrets
  namespace: default
type: Opaque
stringData:
  # Database Credentials (base64 encoded in production)
  # For production, use external secrets management:
  # - AWS: External Secrets Operator with Secrets Manager
  # - Azure: Azure Key Vault Provider for Secrets Store CSI Driver
  # - GCP: Workload Identity with Secret Manager
  
  DB_URL: "jdbc:mysql://mysql-service:3306/crm?useSSL=true"
  DB_USERNAME: "crmuser"
  DB_PASSWORD: "changeme"
  
  # AWS Credentials (if needed)
  # AWS_ACCESS_KEY: ""
  # AWS_SECRET_KEY: ""
  
  # S3 Configuration (if needed)
  # S3_BUCKET_NAME: ""
  # S3_REGION: "us-east-1"
