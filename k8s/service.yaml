apiVersion: v1
kind: Service
metadata:
  name: crm-service
  namespace: default
  labels:
    app: crm
spec:
  type: LoadBalancer
  selector:
    app: crm
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: crm-service-internal
  namespace: default
  labels:
    app: crm
spec:
  type: ClusterIP
  selector:
    app: crm
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
