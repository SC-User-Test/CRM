apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-app
  namespace: default
  labels:
    app: crm
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: crm
        version: v1
    spec:
      # Use service account with IAM role (AWS IRSA, Azure Managed Identity, GCP Workload Identity)
      serviceAccountName: crm-service-account
      
      containers:
      - name: crm
        image: your-registry/crm:latest
        imagePullPolicy: Always
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: crm-config
        
        # Environment variables from Secret
        env:
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: DB_URL
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crm-secrets
              key: DB_PASSWORD
        
        # Resource limits and requests
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        
        # Liveness probe
        livenessProbe:
          httpGet:
            path: /appinfo/health
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Readiness probe
        readinessProbe:
          httpGet:
            path: /appinfo/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Volume mounts for persistent storage
        volumeMounts:
        - name: storage
          mountPath: /mnt/storage
        
        # Security context
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      
      # Volumes
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: crm-storage-pvc
      
      # Pod anti-affinity for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - crm
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crm-service-account
  namespace: default
  annotations:
    # AWS: IAM role for service account
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/crm-app-role
    # Azure: Managed identity
    # azure.workload.identity/client-id: CLIENT_ID
    # GCP: Workload identity
    # iam.gke.io/gcp-service-account: crm-app@PROJECT_ID.iam.gserviceaccount.com
