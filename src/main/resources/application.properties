# Database Configuration
# For cloud deployment, use Azure Database for MySQL or Azure SQL Database
# Connection details should be externalized to Azure App Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# Management Endpoints
management.security.enabled=false
management.context-path=/appinfo

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# ============================================================================
# Cloud-Ready Configuration for Azure
# ============================================================================

# Azure Blob Storage Configuration
# For production, configure these in Azure App Configuration and Key Vault
azure.storage.enabled=${AZURE_STORAGE_ENABLED:false}
azure.storage.account-name=${AZURE_STORAGE_ACCOUNT_NAME:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:crm-files}
azure.storage.endpoint=${AZURE_STORAGE_ENDPOINT:}

# File Path Configuration
# Supports multiple protocols: classpath:, file:, azure-blob:, https:
app.file.base-path=${APP_FILE_BASE_PATH:classpath:/data/}

# CSV File Configuration
app.csv.default-file=${APP_CSV_DEFAULT_FILE:classpath:/data/sample.csv}

# Timezone Configuration
# Use UTC for all server-side operations to ensure consistency across regions
app.timezone=${APP_TIMEZONE:UTC}
app.display-timezone=${APP_DISPLAY_TIMEZONE:UTC}

# ============================================================================
# Azure App Configuration Integration (Optional)
# ============================================================================
# Uncomment and configure for Azure App Configuration integration
# spring.cloud.azure.appconfiguration.stores[0].endpoint=${AZURE_APPCONFIG_ENDPOINT}
# spring.cloud.azure.appconfiguration.stores[0].connection-string=${AZURE_APPCONFIG_CONNECTION_STRING}

# ============================================================================
# Azure Key Vault Integration (Optional)
# ============================================================================
# Uncomment and configure for Azure Key Vault integration
# azure.keyvault.enabled=${AZURE_KEYVAULT_ENABLED:false}
# azure.keyvault.uri=${AZURE_KEYVAULT_URI:}
# azure.keyvault.client-id=${AZURE_KEYVAULT_CLIENT_ID:}
# azure.keyvault.client-key=${AZURE_KEYVAULT_CLIENT_KEY:}
# azure.keyvault.tenant-id=${AZURE_KEYVAULT_TENANT_ID:}

# ============================================================================
# Deployment Notes
# ============================================================================
# For Azure Container Apps / App Service deployment:
# 1. Set environment variables for all ${...} placeholders
# 2. Use Azure App Configuration for centralized configuration management
# 3. Use Azure Key Vault for sensitive values (passwords, keys, connection strings)
# 4. Enable Azure Managed Identity for secure access to Azure services
# 5. Configure Azure Application Insights for monitoring and logging
