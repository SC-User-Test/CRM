spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:crm}?useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

management.security.enabled=false
management.context-path=/appinfo
management.endpoints.web.exposure.include=health,info

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
