# Database Configuration - Use environment variables for cloud deployment
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# Connection Pool Configuration for Cloud Deployment
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1200000}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}

# Security Management - Enable for production
management.security.enabled=${MANAGEMENT_SECURITY_ENABLED:true}
management.context-path=/actuator
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,metrics}

# Thymeleaf Configuration - Updated for modern cloud deployment
spring.thymeleaf.mode=${THYMELEAF_MODE:HTML}
spring.thymeleaf.cache=${THYMELEAF_CACHE_ENABLED:true}

# PDF Storage Configuration
app.pdf.storage.path=${PDF_STORAGE_PATH:${java.io.tmpdir}/pdf-storage}
