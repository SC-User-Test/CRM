# Database Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

# Management Endpoints
management.security.enabled=false
management.context-path=/appinfo

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# ============================================
# Azure Cloud Configuration
# ============================================

# Azure Blob Storage Configuration
# Replace with your actual Azure Storage connection string
# Format: DefaultEndpointsProtocol=https;AccountName=<account-name>;AccountKey=<account-key>;EndpointSuffix=core.windows.net
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:data-files}

# Azure Service Bus Configuration (for distributed scheduling)
# Replace with your actual Azure Service Bus connection string
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:scheduled-tasks}

# ============================================
# Cloud-Ready Configuration Notes
# ============================================
# 1. All Azure credentials should be provided via environment variables
# 2. Never commit actual connection strings to source control
# 3. Use Azure Key Vault for production secrets management
# 4. Container names should be lowercase and follow Azure naming conventions
# 5. For local development, set environment variables or use Azure Storage Emulator
#
# Environment Variables to Set:
# - AZURE_STORAGE_CONNECTION_STRING: Azure Storage account connection string
# - AZURE_STORAGE_CONTAINER_NAME: Container name for blob storage (optional, defaults to 'data-files')
# - AZURE_SERVICEBUS_CONNECTION_STRING: Service Bus namespace connection string
# - AZURE_SERVICEBUS_QUEUE_NAME: Queue name for scheduled messages (optional, defaults to 'scheduled-tasks')
