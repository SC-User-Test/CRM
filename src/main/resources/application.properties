spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# Google Cloud Storage Configuration
# Set via environment variable: GCS_BUCKET_NAME
gcs.bucket.name=${GCS_BUCKET_NAME:default-bucket}
# GCS credentials should be configured via GOOGLE_APPLICATION_CREDENTIALS environment variable
# pointing to service account JSON key file
