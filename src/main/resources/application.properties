spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

# AWS S3 Configuration for cloud-native storage
# These values should be overridden via environment variables in cloud deployments
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:crm-storage-bucket}
aws.s3.pdf.prefix=${AWS_S3_PDF_PREFIX:pdfs/}
aws.s3.csv.prefix=${AWS_S3_CSV_PREFIX:csv/}

# Cloud-native configuration notes:
# - AWS credentials are automatically loaded from environment or IAM roles
# - Use AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY environment variables for local development
# - In production, use IAM roles for EC2/ECS/EKS for secure credential management
