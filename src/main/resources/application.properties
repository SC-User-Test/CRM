# Cloud-Ready Application Configuration
# All sensitive values and environment-specific settings use environment variables
# Compatible with AWS, Azure, and GCP cloud environments

# Database Configuration - Externalized to Environment Variables
# Set these environment variables in your cloud deployment:
# - DB_URL: Full JDBC connection URL (e.g., jdbc:mysql://rds-endpoint:3306/crm?useSSL=true)
# - DB_USERNAME: Database username
# - DB_PASSWORD: Database password (use AWS Secrets Manager, Azure Key Vault, or GCP Secret Manager)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# JPA/Hibernate Configuration
# For production, use 'validate' or 'none' instead of 'create-drop'
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.jpa.show-sql=${DB_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQL5Dialect}

# Connection Pool Configuration (Cloud-Ready)
# HikariCP is the default connection pool in Spring Boot
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# Actuator Configuration - Externalized
management.security.enabled=${MANAGEMENT_SECURITY_ENABLED:false}
management.context-path=${MANAGEMENT_CONTEXT_PATH:/appinfo}

# For Spring Boot 2.x+, use:
# management.endpoints.web.base-path=/appinfo
# management.endpoints.web.exposure.include=health,info,metrics

# Thymeleaf Configuration
spring.thymeleaf.mode=${THYMELEAF_MODE:LEGACYHTML5}
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Server Configuration - Externalized Port
server.port=${SERVER_PORT:8080}

# File Storage Configuration - Cloud-Compatible
# For AWS: Use EFS mount path (e.g., /mnt/efs/pdfs)
# For Azure: Use Azure Files mount path (e.g., /mnt/azure/pdfs)
# For GCP: Use GCS FUSE mount path (e.g., /mnt/gcs/pdfs)
pdf.storage.path=${PDF_STORAGE_PATH:/tmp/pdfs}
csv.storage.path=${CSV_STORAGE_PATH:/tmp/csv}
upload.storage.path=${UPLOAD_STORAGE_PATH:/tmp/uploads}

# Logging Configuration - Cloud-Ready
# Use JSON format for cloud log aggregation (CloudWatch, Azure Monitor, Stackdriver)
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.crm=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.web=${LOG_LEVEL_SPRING_WEB:INFO}
logging.level.org.hibernate=${LOG_LEVEL_HIBERNATE:WARN}

# For JSON logging, add logback-spring.xml with JSON encoder
# logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Application Configuration
spring.application.name=${APP_NAME:CompTestCRM}

# Security Configuration
# For production, enable HTTPS and configure SSL certificates
# server.ssl.enabled=${SSL_ENABLED:false}
# server.ssl.key-store=${SSL_KEYSTORE_PATH:}
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
# server.ssl.key-store-type=${SSL_KEYSTORE_TYPE:PKCS12}

# Health Check Configuration
management.health.db.enabled=${HEALTH_DB_ENABLED:true}
management.health.diskspace.enabled=${HEALTH_DISKSPACE_ENABLED:true}

# AWS-Specific Configuration (Optional)
# cloud.aws.region.static=${AWS_REGION:us-east-1}
# cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:}
# cloud.aws.credentials.secret-key=${AWS_SECRET_KEY:}

# For AWS S3 integration (if needed):
# aws.s3.bucket=${S3_BUCKET_NAME:}
