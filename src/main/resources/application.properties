spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false
management.context-path=/appinfo

spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# AWS S3 Configuration for cloud-native storage
# Replace with environment variables in production: ${AWS_S3_BUCKET_NAME}
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:crm-application-storage}
aws.region=${AWS_REGION:us-east-1}

# AWS credentials should be provided via IAM roles, environment variables, or AWS credentials file
# Do NOT hardcode AWS access keys in this file
# AWS SDK will automatically use:
# 1. Environment variables (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY)
# 2. IAM instance profile credentials (recommended for EC2/ECS/EKS)
# 3. AWS credentials file (~/.aws/credentials)
