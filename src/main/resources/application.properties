# Database Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

# Management Endpoints
management.security.enabled=false
management.context-path=/appinfo

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# ============================================
# Azure Cloud Configuration
# ============================================

# Azure Blob Storage Configuration
# Replace with your Azure Storage connection string
# Format: DefaultEndpointsProtocol=https;AccountName=<account-name>;AccountKey=<account-key>;EndpointSuffix=core.windows.net
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:crm-files}

# Azure Service Bus Configuration (for distributed scheduling)
# Replace with your Azure Service Bus connection string
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:crm-tasks}

# Timezone Configuration - Use UTC for cloud consistency
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ============================================
# Cloud-Ready Configuration Notes
# ============================================
# 1. Set AZURE_STORAGE_CONNECTION_STRING environment variable for Azure Blob Storage
# 2. Set AZURE_STORAGE_CONTAINER_NAME to specify the container (default: crm-files)
# 3. Set AZURE_SERVICEBUS_CONNECTION_STRING for distributed task scheduling
# 4. All file operations now use Azure Blob Storage instead of local file system
# 5. Timezone is set to UTC for consistency across distributed cloud environments
