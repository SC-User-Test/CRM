# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop

# Database configuration - use environment variables for cloud deployment
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# Management/Actuator Configuration
management.security.enabled=false
management.context-path=/appinfo

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# AWS S3 Configuration for cloud-native storage
# These values should be provided via environment variables in cloud deployments
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:default-crm-bucket}
aws.s3.pdf.prefix=${AWS_S3_PDF_PREFIX:pdfs/}
aws.s3.csv.prefix=${AWS_S3_CSV_PREFIX:csv/}
aws.region=${AWS_REGION:us-east-1}
