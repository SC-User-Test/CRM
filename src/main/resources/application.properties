spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

management.security.enabled=false

# Azure Blob Storage Configuration (Cloud-ready file storage)
# Replace with actual Azure Storage connection string from environment variable or Azure Key Vault
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=${AZURE_STORAGE_CONTAINER_NAME:data-files}

# Application Timezone Configuration (Cloud-ready time handling)
# Use UTC for consistency across distributed cloud environments
app.timezone=${APP_TIMEZONE:UTC}

# Azure Service Bus Configuration (for scheduled messaging)
# Replace with actual Azure Service Bus connection string from environment variable or Azure Key Vault
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:scheduled-tasks}
azure.servicebus.topic-name=${AZURE_SERVICEBUS_TOPIC_NAME:scheduled-events}
spring.thymeleaf.cache=false
