# Database Configuration - Use environment variables for cloud deployment
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:create-drop}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crm?useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}

# Actuator Configuration
management.security.enabled=false
management.context-path=/appinfo

# Thymeleaf Configuration
spring.thymeleaf.mode=LEGACYHTML5
spring.thymeleaf.cache=false

# AWS S3 Configuration - Cloud-native storage
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:crm-storage-bucket}
aws.s3.pdf.prefix=${AWS_S3_PDF_PREFIX:pdfs/}
aws.s3.csv.prefix=${AWS_S3_CSV_PREFIX:csv/}

# AWS Credentials are managed via:
# 1. Environment variables: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# 2. IAM roles (recommended for EC2/ECS/EKS)
# 3. AWS credentials file (~/.aws/credentials)
