spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=crm;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false

# Spring Boot 3.x: ensure data.sql runs after JPA schema creation
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/appinfo

spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
