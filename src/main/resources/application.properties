spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/crm?useSSL=true&requireSSL=true&verifyServerCertificate=false}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:password}

# Management and actuator endpoints
management.security.enabled=false
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,env,configprops
management.endpoint.health.show-details=when-authorized
management.metrics.export.cloudwatch.enabled=${CLOUDWATCH_METRICS_ENABLED:false}
management.metrics.export.cloudwatch.namespace=${CLOUDWATCH_NAMESPACE:CompCRMApp}
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.1}

# Structured logging for cloud environments
logging.level.crm=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n

# Thymeleaf configuration
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# HikariCP connection pool configuration for cloud deployment
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1200000}
spring.datasource.hikari.leak-detection-threshold=${DB_LEAK_DETECTION_THRESHOLD:60000}
