spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://localhost:3306/crm?useSSL=false
spring.datasource.username=root
spring.datasource.password=password

# Management endpoints configuration for Spring Boot 3.x
management.endpoints.web.exposure.include=*
management.endpoints.web.base-path=/appinfo

# Thymeleaf configuration for Spring Boot 3.x
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
