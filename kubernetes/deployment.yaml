apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-km1
  namespace: test-km1
  labels:
    app: test-km1
    version: v1
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-km1
  template:
    metadata:
      labels:
        app: test-km1
        version: v1
    spec:
      containers:
      - name: test-km1
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "production"
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
        - name: TZ
          value: "UTC"
        - name: DATABASE_URL
          value: "{{DATABASE_URL}}"
        - name: DATABASE_USERNAME
          value: "{{DATABASE_USERNAME}}"
        - name: DATABASE_PASSWORD
          value: "{{DATABASE_PASSWORD}}"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: config
        emptyDir: {}
      - name: logs
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: test-km1-hpa
  namespace: test-km1
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: test-km1
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80