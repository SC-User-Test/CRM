version: '3.8'

services:
  crm-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: crm-app:latest
    container_name: crm-application
    ports:
      - "8080:8080"
    environment:
      # JVM Configuration
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      
      # Spring Boot Profile
      - SPRING_PROFILES_ACTIVE=docker
      
      # Database Configuration (external service)
      - DB_HOST=${DB_HOST:-mysql-host}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-crm}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      
      # Timezone
      - TZ=UTC
    volumes:
      # Application logs
      - ./logs:/app/logs
    networks:
      - crm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  crm-network:
    driver: bridge

volumes:
  logs:
    driver: local