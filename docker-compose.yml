version: '3.8'

services:
  crm-app:
    build: .
    image: crm-app:latest
    container_name: crm-app
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=UTC
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=crm
      - DB_USER=root
      - DB_PASSWORD=password
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/appinfo/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  logs:
    driver: local
  config:
    driver: local